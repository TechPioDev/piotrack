# Piotrack — name-based virtual host for piotrack.com (port 80).
#
# This server also runs a live IT Support Portal, served by a catch-all vhost
# that answers every Host header. This file is additive: Apache matches
# ServerName first and falls back to the default vhost for every other
# hostname, so the helpdesk keeps answering exactly as it does now.
#
# The filename matters. Apache loads sites-enabled/*.conf alphabetically and
# treats the FIRST *:80 vhost as the default for unmatched hostnames. The zzz-
# prefix guarantees this file loads last, so it can never take over as the
# catch-all no matter what the other config is called.
#
# Install:
#   sudo cp zzz-piotrack.conf /etc/apache2/sites-available/
#   sudo a2ensite zzz-piotrack
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# TLS is not configured here: this host has no outbound internet, so certbot
# cannot reach the ACME API to issue a certificate. Once that is resolved,
# `certbot --apache -d piotrack.com -d www.piotrack.com` adds the :443 vhost.

<VirtualHost *:80>
    ServerName piotrack.com
    ServerAlias www.piotrack.com

    DocumentRoot /var/www/piotrack/public

    <Directory /var/www/piotrack/public>
        # Laravel's public/.htaccess owns the front-controller rewrite.
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Keep this app's logs out of the helpdesk's, so an incident in one is
    # readable without the other's traffic interleaved.
    ErrorLog ${APACHE_LOG_DIR}/piotrack-error.log
    CustomLog ${APACHE_LOG_DIR}/piotrack-access.log combined
</VirtualHost>
