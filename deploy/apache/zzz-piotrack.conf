# Piotrack — name-based virtual hosts for piotrack.com.
#
# This server also runs a live IT Support Portal, served by a catch-all vhost
# that answers every Host header. These vhosts are additive: Apache matches
# ServerName first and falls back to the default for every other hostname, so
# the helpdesk keeps answering exactly as it does now.
#
# The filename matters. Apache loads sites-enabled/*.conf alphabetically and
# treats the FIRST *:80 vhost as the default for unmatched hostnames. The zzz-
# prefix guarantees this file loads last, so it can never take over as the
# catch-all no matter what the other config is called.
#
# Install:
#   sudo a2enmod ssl
#   sudo cp zzz-piotrack.conf /etc/apache2/sites-available/
#   sudo a2ensite zzz-piotrack
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The certificate is issued off-box: this host has no outbound internet, so
# certbot cannot reach the ACME API from here. See
# docs/engineering/certificate-renewal.md — it expires every 90 days and does
# NOT renew itself.

<VirtualHost *:80>
    ServerName piotrack.com
    ServerAlias www.piotrack.com

    # Everything moves to TLS. Safe to do unconditionally because validation is
    # DNS-01, so no ACME challenge is ever served over HTTP from this host.
    Redirect permanent / https://piotrack.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName piotrack.com
    ServerAlias www.piotrack.com

    DocumentRoot /var/www/piotrack/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/piotrack/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/piotrack/privkey.pem

    <Directory /var/www/piotrack/public>
        # Laravel's public/.htaccess owns the front-controller rewrite.
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Keep this app's logs out of the helpdesk's, so an incident in one is
    # readable without the other's traffic interleaved.
    ErrorLog ${APACHE_LOG_DIR}/piotrack-error.log
    CustomLog ${APACHE_LOG_DIR}/piotrack-access.log combined
</VirtualHost>
